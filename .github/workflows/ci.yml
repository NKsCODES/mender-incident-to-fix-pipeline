name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e "backend[dev]"
      - run: cd backend && python -m pytest -q
      - name: Harness eval gate
        run: cd backend && python -m mender eval --runner replay
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd dashboard && npm ci && npm run build
  # Model eval spends tokens, so it runs on demand only.
  model-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e "backend[dev]" && curl https://cursor.com/install -fsS | bash
      - run: cd backend && python -m mender eval --runner cursor
        env: {CURSOR_API_KEY: "${{ secrets.CURSOR_API_KEY }}"}
